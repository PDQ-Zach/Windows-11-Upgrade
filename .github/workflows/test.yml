name: Test scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 is what endpoints run
      - name: Run tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Run-Tests.ps1

      - name: Run tests (PowerShell 7)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/Run-Tests.ps1
